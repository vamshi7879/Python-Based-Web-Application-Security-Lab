name = "python-security-lab"
main = "src/index.ts"
type = "service"
compatibility_date = "2024-09-12"

[env.production]
routes = [
  { pattern = "example.com/*", zone_name = "example.com" }
]

# Build configuration
build = { command = "npm run build" }

# Environment variables (if needed)
vars = { ENVIRONMENT = "production" }
